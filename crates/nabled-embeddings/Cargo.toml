[package]
name = "nabled-embeddings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nabled-embeddings"
publish.workspace = true
description = "Lightweight ndarray-native compute and rerank layer for embedding vectors"
readme = "README.md"
keywords = ["embeddings", "retrieval", "rerank", "ndarray", "similarity"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
blas = ["nabled-linalg/blas", "nabled-ml/blas"]
lapack-provider = ["nabled-linalg/lapack-provider", "nabled-ml/lapack-provider"]
openblas-system = ["blas", "lapack-provider", "nabled-linalg/openblas-system", "nabled-ml/openblas-system"]
openblas-static = ["blas", "lapack-provider", "nabled-linalg/openblas-static", "nabled-ml/openblas-static"]
netlib-system = ["blas", "lapack-provider", "nabled-linalg/netlib-system", "nabled-ml/netlib-system"]
netlib-static = ["blas", "lapack-provider", "nabled-linalg/netlib-static", "nabled-ml/netlib-static"]
magma-system = ["lapack-provider", "nabled-linalg/magma-system", "nabled-ml/magma-system"]

[dependencies]
nabled-core.workspace = true
nabled-linalg.workspace = true
nabled-ml.workspace = true
ndarray.workspace = true
ndarray-linalg.workspace = true
num-traits.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "embeddings_benchmarks"
harness = false
