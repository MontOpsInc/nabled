[package]
name = "nabled-sensor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nabled-sensor"
publish.workspace = true
description = "Kalman, EKF, IMU, and camera models for nabled Physical AI estimation"
readme = "README.md"
keywords = ["sensor-fusion", "kalman", "ekf", "ndarray", "robotics"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
blas = ["nabled-linalg/blas"]
lapack-provider = ["nabled-linalg/lapack-provider"]
openblas-system = ["blas", "lapack-provider", "nabled-linalg/openblas-system"]
openblas-static = ["blas", "lapack-provider", "nabled-linalg/openblas-static"]
netlib-system = ["blas", "lapack-provider", "nabled-linalg/netlib-system"]
netlib-static = ["blas", "lapack-provider", "nabled-linalg/netlib-static"]
magma-system = ["lapack-provider", "nabled-linalg/magma-system"]

[dependencies]
nabled-core.workspace = true
nabled-linalg.workspace = true
ndarray.workspace = true

[dev-dependencies]
approx.workspace = true

[lints]
workspace = true
