[package]
name = "nabled-ml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nabled-ml"
publish.workspace = true
description = "ML-oriented algorithms built on ndarray-native nabled primitives"
readme = "README.md"
keywords = ["machine-learning", "ndarray", "optimization", "regression", "pca"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
blas = ["nabled-linalg/blas"]
openblas-system = ["blas", "nabled-linalg/openblas-system"]
openblas-static = ["blas", "nabled-linalg/openblas-static"]
netlib-system = ["blas", "nabled-linalg/netlib-system"]
netlib-static = ["blas", "nabled-linalg/netlib-static"]

[dependencies]
nabled-core.workspace = true
nabled-linalg.workspace = true
ndarray.workspace = true
ndarray-linalg.workspace = true
num-complex.workspace = true
num-traits.workspace = true
serde.workspace = true

[lints]
workspace = true
