[package]
name = "nabled"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish.workspace = true
description = "A linear algebra library written in Rust with an ndarray-first architecture."
readme = "../../README.md"
keywords = ["linear-algebra", "ndarray", "decomposition", "machine-learning", "numerics"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
test-utils = []
arrow = ["dep:arrow-array", "dep:arrow-buffer", "dep:arrow-schema", "dep:ndarrow"]
blas = ["nabled-linalg/blas", "nabled-ml/blas"]
lapack-provider = ["nabled-linalg/lapack-provider", "nabled-ml/lapack-provider"]
openblas-system = ["blas", "nabled-linalg/openblas-system", "nabled-ml/openblas-system"]
openblas-static = ["blas", "nabled-linalg/openblas-static", "nabled-ml/openblas-static"]
netlib-system = ["blas", "nabled-linalg/netlib-system", "nabled-ml/netlib-system"]
netlib-static = ["blas", "nabled-linalg/netlib-static", "nabled-ml/netlib-static"]
magma-system = ["lapack-provider", "nabled-linalg/magma-system", "nabled-ml/magma-system"]
accelerator-rayon = ["nabled-linalg/accelerator-rayon"]
accelerator-wgpu = ["nabled-linalg/accelerator-wgpu"]

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
ndarray.workspace = true
ndarrow = { workspace = true, optional = true }
nabled-core.workspace = true
nabled-linalg.workspace = true
nabled-ml.workspace = true
num-complex.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
criterion.workspace = true
faer.workspace = true
ndarray.workspace = true
num-complex.workspace = true
rand.workspace = true

[lints]
workspace = true

