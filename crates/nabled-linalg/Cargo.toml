[package]
name = "nabled-linalg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nabled-linalg"
publish.workspace = true
description = "Ndarray-native linear algebra algorithms for nabled"
readme = "README.md"
keywords = ["linear-algebra", "ndarray", "svd", "decomposition", "matrix"]
categories = ["mathematics", "science", "algorithms"]

[features]
default = []
blas = ["ndarray/blas"]
lapack-provider = ["dep:ndarray-linalg"]
openblas-system = ["blas", "lapack-provider", "ndarray-linalg/openblas-system"]
openblas-static = ["blas", "lapack-provider", "ndarray-linalg/openblas-static"]
netlib-system = ["blas", "lapack-provider", "ndarray-linalg/netlib-system"]
netlib-static = ["blas", "lapack-provider", "ndarray-linalg/netlib-static"]
accelerator-rayon = ["dep:rayon"]
accelerator-wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
bytemuck = { workspace = true, optional = true }
nabled-core.workspace = true
ndarray.workspace = true
ndarray-linalg = { workspace = true, optional = true }
num-complex.workspace = true
num-traits.workspace = true
pollster = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, optional = true }

[lints]
workspace = true
