[package]
name = "pynabled"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Python bindings for nabled via PyO3"
keywords = ["python", "pyo3", "linear-algebra", "numpy"]
categories = ["python", "mathematics", "science"]

[lib]
name = "_pynabled"
crate-type = ["cdylib"]

[features]
default = []
openblas-system = ["nabled/openblas-system"]
openblas-static = ["nabled/openblas-static"]
netlib-system = ["nabled/netlib-system"]
netlib-static = ["nabled/netlib-static"]
magma-system = ["nabled/magma-system"]
accelerator-rayon = ["nabled/accelerator-rayon"]
accelerator-wgpu = ["nabled/accelerator-wgpu"]
arrow = [
    "nabled/arrow",
    "dep:arrow-pyarrow",
    "dep:arrow-array",
    "dep:arrow-data",
    "dep:arrow-schema",
]

[dependencies]
nabled.workspace = true
nabled-core.workspace = true
nabled-linalg.workspace = true
nabled-ml.workspace = true
ndarray.workspace = true
num-complex.workspace = true
num-traits.workspace = true
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }
arrow-pyarrow = { version = "58", optional = true }
arrow-array = { version = "58", optional = true }
arrow-data = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }

[lints]
workspace = true
