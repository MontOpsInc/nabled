[package]
name = "pynabled"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false
description = "Python bindings for nabled via PyO3"
keywords = ["python", "pyo3", "linear-algebra", "numpy"]
categories = ["python", "mathematics", "science"]

[lib]
name = "_pynabled"
crate-type = ["cdylib"]

[features]
default = []
openblas-system = ["nabled/openblas-system"]
accelerator-rayon = ["nabled-linalg/accelerator-rayon"]

[dependencies]
nabled.workspace = true
nabled-linalg.workspace = true
nabled-ml.workspace = true
ndarray.workspace = true
num-complex.workspace = true
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }

[lints]
workspace = true
