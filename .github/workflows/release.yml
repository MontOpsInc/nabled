name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Create release only'
        default: false
        required: false
        type: boolean
      skip_core:
        description: 'Skip publishing nabled-core'
        default: false
        required: false
        type: boolean
      skip_linalg:
        description: 'Skip publishing nabled-linalg'
        default: false
        required: false
        type: boolean
      skip_ml:
        description: 'Skip publishing nabled-ml'
        default: false
        required: false
        type: boolean
      skip_facade:
        description: 'Skip publishing nabled facade crate'
        default: false
        required: false
        type: boolean
      verify_publish:
        description: 'Verify publish order with --dry-run before publish'
        default: false
        required: false
        type: boolean
      version:
        description: 'Version to release (e.g., 0.1.5)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: '-C debuginfo=line-tables-only -C incremental=false'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version consistency
        run: |
          # Determine version based on trigger type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              # Use provided version input
              VERSION="${{ inputs.version }}"
              echo "Using provided version: $VERSION"
            else
              # Extract version from [workspace.package] in Cargo.toml
              VERSION=$(awk '/^\[workspace\.package\]/ {in_workspace_package=1; next} in_workspace_package && /^version = / {gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
              echo "Using version from Cargo.toml: $VERSION"
            fi
          else
            # Extract version from tag (push trigger)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Using version from tag: $VERSION"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Check that [workspace.package] version matches expected version.
          CARGO_VERSION=$(awk '/^\[workspace\.package\]/ {in_workspace_package=1; next} in_workspace_package && /^version = / {gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          if [ -z "$CARGO_VERSION" ]; then
            echo "Error: could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "Error: workspace version ($CARGO_VERSION) does not match expected version ($VERSION)"
            echo "Please ensure versions are consistent"
            exit 1
          fi

      - name: Verify publish
        if: ${{ inputs.skip_publish != true && inputs.verify_publish == true }}
        run: |
          cargo publish --dry-run -p nabled-core --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish nabled-core to crates.io
        if: ${{ inputs.skip_publish != true && inputs.skip_core != true }}
        run: |
          cargo publish -p nabled-core --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          sleep 30
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish nabled-linalg to crates.io
        if: ${{ inputs.skip_publish != true && inputs.skip_linalg != true }}
        run: |
          cargo publish -p nabled-linalg --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          sleep 30
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish nabled-ml to crates.io
        if: ${{ inputs.skip_publish != true && inputs.skip_ml != true }}
        run: |
          cargo publish -p nabled-ml --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          sleep 30
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish nabled facade to crates.io
        if: ${{ inputs.skip_publish != true && inputs.skip_facade != true }}
        run: |
          cargo publish -p nabled --no-verify --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Extract release notes
        run: |
          # Check if RELEASE_NOTES.md exists (from the PR)
          if [ -f "RELEASE_NOTES.md" ]; then
            cp RELEASE_NOTES.md release_notes_for_tag.md
          else
            # Generate release notes for this tag if not present
            echo "# Release v$VERSION" > release_notes_for_tag.md
            echo "" >> release_notes_for_tag.md
            echo "This release was published from tag v$VERSION" >> release_notes_for_tag.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes_for_tag.md
          draft: false
          prerelease: ${{ contains(env.VERSION, '-rc') || contains(env.VERSION, '-beta') || contains(env.VERSION, '-alpha') }}
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
