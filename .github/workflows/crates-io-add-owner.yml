name: crates.io add owner

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'crates.io username to add as owner'
        default: 'NiklausParcell'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  add-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add co-owner to workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_TERM_COLOR: never
        run: bash scripts/crates_io_ensure_coowners.sh "${{ inputs.username }}"
