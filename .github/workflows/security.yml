name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

  # Rerun periodically to pick up new advisories
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      python: ${{ steps.changes.outputs.python }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          rust:
            - '.github/workflows/security.yml'
            - '**/Cargo.toml'
            - '**/Cargo.lock'
          python:
            - '.github/workflows/security.yml'
            - 'pyproject.toml'
            - 'scripts/python_quality_gate.sh'
            - 'python/**'

  audit:
    name: Audit Rust Dependencies
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      issues: write
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit check
        # PyO3 0.29 requires arrow-pyarrow 59, while ndarrow 0.0.4 still
        # requires Arrow 58. pynabled does not use the affected PyList/PyTuple
        # iterator or PyCFunction::new_closure APIs. Remove these ignores with
        # the coordinated Arrow 59 / ndarrow upgrade.
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2025-0020
          --ignore RUSTSEC-2026-0176
          --ignore RUSTSEC-2026-0177

  python-audit:
    name: Audit Python Dependencies
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python audit environment
        run: |
          python -m pip install "pip-audit==2.10.0"
          cat > /tmp/pynabled-audit-requirements.txt <<'REQ'
          maturin==1.13.1
          numpy>=1.16
          pytest>=7.0
          pytest-cov>=7.0
          pyarrow>=14
          REQ
      - name: Run Python dependency audit
        run: python -m pip_audit --requirement /tmp/pynabled-audit-requirements.txt --cache-dir .cache/pip-audit

  no-dependency-changes:
    name: No Dependency Changes
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'false' && needs.changes.outputs.python == 'false'
    steps:
      - run: echo "No dependency changes detected"
