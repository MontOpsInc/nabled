[workspace]
members = [
    "crates/nabled",
    "crates/nabled-core",
    "crates/nabled-linalg",
    "crates/nabled-ml",
    "crates/nabled-embeddings",
    "crates/nabled-kinematics",
    "crates/nabled-model",
    "crates/nabled-dynamics",
    "crates/nabled-control",
    "crates/nabled-sensor",
    "crates/nabled-sim",
    "crates/pynabled",
]
default-members = [
    "crates/nabled",
    "crates/nabled-core",
    "crates/nabled-linalg",
    "crates/nabled-ml",
    "crates/nabled-embeddings",
    "crates/nabled-kinematics",
    "crates/nabled-model",
    "crates/nabled-dynamics",
    "crates/nabled-control",
    "crates/nabled-sensor",
    "crates/nabled-sim",
]
resolver = "3"

[workspace.package]
version = "0.0.11"
edition = "2024"
rust-version = "1.92"
authors = ["Niklaus Parcell <nik.parcell@gmail.com>", "George Lee Patterson <patterson.george@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/MontOpsInc/nabled"
homepage = "https://github.com/MontOpsInc/nabled"
documentation = "https://docs.rs/nabled"
publish = true

[workspace.dependencies]
nabled = { path = "crates/nabled", version = "=0.0.11" }
nabled-core = { path = "crates/nabled-core", version = "=0.0.11" }
nabled-linalg = { path = "crates/nabled-linalg", version = "=0.0.11" }
nabled-ml = { path = "crates/nabled-ml", version = "=0.0.11" }
nabled-embeddings = { path = "crates/nabled-embeddings", version = "=0.0.11" }
nabled-kinematics = { path = "crates/nabled-kinematics", version = "=0.0.11" }
nabled-model = { path = "crates/nabled-model", version = "=0.0.11" }
nabled-dynamics = { path = "crates/nabled-dynamics", version = "=0.0.11" }
nabled-control = { path = "crates/nabled-control", version = "=0.0.11" }
nabled-sensor = { path = "crates/nabled-sensor", version = "=0.0.11" }
nabled-sim = { path = "crates/nabled-sim", version = "=0.0.11" }

approx = "0.5"
arrow-array = "58"
arrow-buffer = "59"
arrow-schema = { version = "58", features = ["canonical_extension_types"] }
criterion = "0.8"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
ndarray = { version = "0.17", features = ["serde"] }
ndarray-linalg = { version = "0.18", default-features = false }
ndarrow = "0.0.4"
num-complex = "0.4"
num-traits = "0.2"
rand = "0.10"
rayon = "1.11"
quick-xml = "0.37"
realfft = "3.5"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "28"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
large_futures = "warn"
clone_on_ref_ptr = "warn"
must_use_candidate = "allow"

[workspace.lints.rust]
unused_imports = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "warn"
let_underscore_drop = "warn"
missing_copy_implementations = "warn"
redundant_lifetimes = "warn"
rust_2024_incompatible_pat = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_results = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[profile.release-with-debug]
inherits = "release"
debug = "full"

[profile.release-lto]
inherits = "release"
lto = true
opt-level = 3
codegen-units = 1

[profile.instruments]
inherits = "release"
debug = "full"
lto = "off"
codegen-units = 16
opt-level = 2
debug-assertions = false
incremental = false

[profile.release-with-debug.package."*"]
debug = "full"

[profile.instruments.package."*"]
debug = "full"

[profile.ci]
inherits = "dev"
incremental = false

[profile.ci.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false
